name: libya-data-platform

# Libya Data Platform — local development stack.
#
# Core pipeline: producers (Python) -> Redpanda -> stream processor (Rust)
#                -> ClickHouse -> API (FastAPI) / Grafana.
# Orchestration profile adds Airflow for scheduled batch ingestion.
#
#   docker compose up -d                    core stack
#   docker compose --profile orchestration up -d   + Airflow

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-libya}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ly}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-devpass}

x-kafka-env: &kafka-env
  KAFKA_BROKERS: redpanda:9092
  TOPIC_EVENTS: ${TOPIC_EVENTS:-ly.events.raw}
  TOPIC_DLQ: ${TOPIC_DLQ:-ly.events.dlq}

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-libya}
  POSTGRES_USER: ${POSTGRES_USER:-ly}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.7
    container_name: ldp-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q true || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  console:
    image: docker.redpanda.com/redpandadata/console:v3.2.0
    container_name: ldp-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: ldp-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-libya}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ly}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-devpass}
    volumes:
      - ./db/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./db/clickhouse/config:/etc/clickhouse-server/config.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: ldp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-libya}
    volumes:
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  producer-gdelt:
    build: ./services/producers
    container_name: ldp-producer-gdelt
    command: ["python", "-m", "ly_ingest.gdelt"]
    environment:
      <<: [*kafka-env, *postgres-env]
      GDELT_QUERY: ${GDELT_QUERY:-libya}
      GDELT_MAX_RECORDS: ${GDELT_MAX_RECORDS:-250}
      POLL_INTERVAL_SECONDS: ${GDELT_POLL_INTERVAL_SECONDS:-300}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  producer-worldbank:
    build: ./services/producers
    container_name: ldp-producer-worldbank
    command: ["python", "-m", "ly_ingest.worldbank"]
    environment:
      <<: [*kafka-env, *postgres-env]
      WORLDBANK_INDICATORS: ${WORLDBANK_INDICATORS:-NY.GDP.PETR.RT.ZS,NY.GDP.MKTP.CD,SP.POP.TOTL}
      POLL_INTERVAL_SECONDS: ${WORLDBANK_POLL_INTERVAL_SECONDS:-86400}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  processor:
    build: ./services/stream-processor
    container_name: ldp-processor
    environment:
      <<: [*kafka-env, *clickhouse-env]
      CONSUMER_GROUP: ly-processor
      BATCH_MAX_MESSAGES: "500"
      BATCH_FLUSH_MS: "2000"
      RUST_LOG: info
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: ldp-api
    environment:
      <<: [*clickhouse-env, *postgres-env]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ldp-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ldp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    depends_on:
      - clickhouse
      - prometheus

  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    container_name: ldp-airflow
    profiles: ["orchestration"]
    environment:
      <<: [*kafka-env, *postgres-env]
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-ly}:${POSTGRES_PASSWORD:-devpass}@postgres:5432/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-jwt-secret-change-me}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: airflow standalone
    volumes:
      - ./dags:/opt/airflow/dags:ro
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  redpanda-data:
  clickhouse-data:
  postgres-data:
  prometheus-data:
  grafana-data:
