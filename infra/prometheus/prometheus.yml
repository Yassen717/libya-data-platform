# Prometheus scrape config for the dev stack.
# Mounted read-only at /etc/prometheus/prometheus.yml by docker-compose.
#
# All targets are scraped over the internal compose network; only the
# Prometheus UI port (9090) is published to the host.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Recording/alerting rules attach here once the pipeline grows SLOs (M4+).
# rule_files: []

scrape_configs:
  # Redpanda exposes a Prometheus endpoint on the admin port. /public_metrics
  # is the curated, bounded-cardinality surface (internal /metrics is far
  # more verbose and intended for Redpanda's own support tooling).
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  # ClickHouse built-in Prometheus exporter on protocol port 8001.
  # Enabled by db/clickhouse/config/prometheus.xml, which must be mounted
  # into /etc/clickhouse-server/config.d/ to take effect.
  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:8001"]

  # FastAPI: the prometheus-fastapi-instrumentator exposes /metrics.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
