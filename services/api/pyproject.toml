[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ly-api"
version = "0.1.0"
description = "Serving API for the Libya Data Platform (ClickHouse + Postgres read layer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "clickhouse-connect",
    "psycopg[binary]",
    "pydantic-settings",
    "prometheus-fastapi-instrumentator",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
